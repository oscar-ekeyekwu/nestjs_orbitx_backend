# /etc/nginx/sites-available/orbitx-api
#
# Reverse proxy + TLS termination: public :80/:443 on the VPS → backend
# API container :3000 (published by orbitx-backend's docker-compose.yml).
#
# Install steps on the VPS:
#   1. sudo ./generate-self-signed-cert.sh
#      (creates the placeholder cert this file points at — see script
#      header for details)
#   2. Copy this file to /etc/nginx/sites-available/orbitx-api
#   3. sudo ln -s /etc/nginx/sites-available/orbitx-api /etc/nginx/sites-enabled/
#   4. sudo nginx -t
#   5. sudo systemctl reload nginx
#
# Swap in a real cert once DNS/HTTP-01 is ready:
#   sudo certbot --nginx -d api.orbitxng.com
# certbot finds the existing `listen 443 ssl` block for this server_name
# and rewrites the ssl_certificate directives in place — no need to touch
# the location blocks below.

upstream orbitx_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name api.orbitxng.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api.orbitxng.com;

    # Self-signed cert from generate-self-signed-cert.sh — clients will see
    # a trust warning until this is swapped for a real cert via certbot
    # (see header comment above).
    ssl_certificate     /etc/ssl/orbitx/api.orbitxng.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/orbitx/api.orbitxng.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # KYC document uploads go through this API — largest multer limit
    # (src/upload/config/multer.config.ts) is 10MB; leave headroom.
    client_max_body_size 15m;

    # Realtime gateway (src/realtime/realtime.gateway.ts, socket.io default
    # path) needs the connection upgraded, not just proxied.
    location /socket.io/ {
        proxy_pass http://orbitx_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://orbitx_api;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
