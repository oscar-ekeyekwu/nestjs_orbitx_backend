name: Deploy Orbitx App (Zero Downtime)

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        # actions/checkout defaults to the PR head commit (development) on a
        # pull_request event — not main. main already has the merge commit
        # by the time this `closed` event fires, so pin the checkout to it
        # explicitly to make sure the image is built from main.
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/orbitx-app:latest
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Copy project files to server
        # Pinned to a tagged release — `@master` tried to fetch its
        # drone-scp binary anonymously from GitHub releases and hit a 403
        # rate limit. v0.1.7+ passes GITHUB_TOKEN automatically.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'docker-compose.yml,.env'
          target: '/home/${{ secrets.SERVER_USER }}/orbitx-backend'

      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            DEPLOY_DIR=/home/${{ secrets.SERVER_USER }}/orbitx-backend

            echo "Creating deployment directory..."
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            echo "Logging into GitHub Container Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling latest images..."
            docker pull postgres:15
            docker pull ghcr.io/${{ github.repository_owner }}/orbitx-app:latest

            echo "Stopping existing services..."
            docker compose down || true

            echo "Waiting for containers to stop..."
            sleep 3

            # docker-compose.yml declares `orbitx-network` as external because
            # the admin frontend and other services on this VPS share it.
            # Create it on first deploy / fresh VPS — no-op on subsequent runs.
            echo "Ensuring shared orbitx-network exists..."
            docker network create orbitx-network 2>/dev/null || true

            echo "Starting services with docker compose..."
            docker compose up -d

            echo "Waiting for services to be ready..."
            sleep 10

            echo "Checking service status..."
            docker compose ps

            echo "Running database migrations..."
            docker compose exec -T app node ./node_modules/typeorm/cli.js migration:run -d ./dist/ormconfig.js || true

            echo "Seeding admin user..."
            docker compose exec -T app node dist/src/database/seeds/admin.seed.js || true

            echo "Checking app logs..."
            docker compose logs app | tail -20
